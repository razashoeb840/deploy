<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediPulse - Patient History Dashboard</title>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: #f0fdf4; color: #0f172a; min-height: 100vh; padding: 40px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; background: white; padding: 25px 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border-left: 6px solid #10b981; }
        .header h1 { color: #064e3b; font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .header p { color: #64748b; margin-top: 8px; font-size: 14px; font-weight: 500; }
        
        a.btn-back { background: #10b981; padding: 12px 24px; text-decoration: none; color: white; border-radius: 10px; font-weight: 600; font-size: 14px; transition: 0.3s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        a.btn-back:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }

        .table-container { background: white; border-radius: 20px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #04384b; padding: 18px 24px; font-weight: 600; color: white; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: none; }
        td { padding: 20px 24px; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: #334155; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fafc; }
        
        .badge { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
        .bg-green { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .bg-gray { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .bg-blue { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        
        .time-box { display: flex; flex-direction: column; gap: 6px; background: #f8fafc; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .time-item { font-size: 12px; color: #64748b; font-weight: 500; display: flex; justify-content: space-between; align-items: center;}
        .time-val { font-weight: 700; color: #0f172a; }
        
        .patient-card { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 45px; height: 45px; border-radius: 12px; background: #ecfdf5; color: #10b981; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
        
        .search-panel {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            border-left: 6px solid #04384b;
            margin-bottom: 30px;
        }
        .search-panel h3 {
            font-size: 16px;
            font-weight: 700;
            color: #04384b;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .search-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .search-group label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
        }
        .search-group input {
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }
        .search-group input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        .search-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .btn-search {
            background: #04384b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-search:hover {
            background: #032a39;
        }
        .btn-clear {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-clear:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        /* --- Responsive Adjustments --- */
        @media(max-width: 768px) {
            body { padding: 20px; }
            .header { flex-direction: column; align-items: flex-start; gap: 15px; padding: 20px; }
            .header h1 { font-size: 22px; }
            a.btn-back { width: 100%; justify-content: center; }
            .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            table { min-width: 800px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1><i class="fas fa-book-medical"></i> Patient Lifecycles</h1>
            <p>Comprehensive historical ledger of all admitted, consulted, and discharged patients.</p>
        </div>
        <div style="display:flex; gap: 15px; align-items:center;">
            <div class="theme-selector-container">
                <select id="themeSelector" class="theme-select" onchange="setTheme(this.value)">
                    <option value="theme-default">Default Theme</option>
                    <option value="theme-dark-1">Sci-Fi (3D)</option>
                    <option value="theme-dark-2">Bio-Medical (Video)</option>
                </select>
            </div>
            <a href="1index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Home</a>
        </div>
    </div>

    <!-- Simplified Search Section -->
    <div class="search-panel" style="padding: 20px 25px;">
        <h3 style="margin-bottom: 10px;"><i class="fas fa-search"></i> Search Patient History</h3>
        <div style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
            <div class="search-group" style="flex: 1; min-width: 160px;">
                <label for="searchType" style="font-size: 12px; font-weight: 600; color: #475569;">Search By</label>
                <select id="searchType" style="padding: 11px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none; background: white; cursor: pointer; transition: all 0.2s;">
                    <option value="patientId">Patient ID (PID)</option>
                    <option value="name">Patient Name</option>
                    <option value="phone">Phone Number</option>
                    <option value="aadhar">Aadhaar Number</option>
                    <option value="doctorName">Doctor Name</option>
                    <option value="prescriptionId">Prescription ID</option>
                </select>
            </div>
            <div class="search-group" style="flex: 2; min-width: 240px;">
                <label for="searchValue" style="font-size: 12px; font-weight: 600; color: #475569;">Search Value</label>
                <input type="text" id="searchValue" placeholder="Enter search keywords..." style="width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none; transition: all 0.2s ease;">
            </div>
            <div class="search-group" style="flex: 1; min-width: 150px;">
                <label for="searchDate" style="font-size: 12px; font-weight: 600; color: #475569;">Filter by Date</label>
                <input type="date" id="searchDate" style="padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none; transition: all 0.2s ease; background: white; cursor: pointer;">
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn-search" onclick="fetchHistory()" style="padding: 11px 20px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; white-space: nowrap;"><i class="fas fa-search"></i> Search Patient</button>
                <button class="btn-clear" onclick="clearFilters()" style="padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid #cbd5e1; white-space: nowrap;"><i class="fas fa-sync-alt"></i> Reset</button>
            </div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>Token</th>
                    <th>Assigned Doctor</th>
                    <th>Diagnosis</th>
                    <th>Status</th>
                    <th>Lifecycle Timeline (Registration → Consult → Departure)</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <tr>
                    <td colspan="6" style="text-align: center; padding: 40px; color: #94a3b8;">Loading history...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE = window.location.hostname && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1' 
            ? '/api' 
            : (window.location.port === '5000' ? '/api' : 'http://localhost:5000/api');

        function fmtTime(dateString) {
            if (!dateString) return '-';
            const d = new Date(dateString);
            return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function fmtDate(dateString) {
            if (!dateString) return '-';
            const d = new Date(dateString);
            return d.toLocaleDateString();
        }

        async function fetchHistory() {
            try {
                const searchType = document.getElementById('searchType').value;
                const searchValue = document.getElementById('searchValue').value.trim();
                const searchDate = document.getElementById('searchDate').value;

                const params = new URLSearchParams();
                if (searchValue) {
                    params.append(searchType, searchValue);
                }
                if (searchDate) {
                    params.append('date', searchDate);
                }

                const tbody = document.getElementById('historyBody');
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #94a3b8;">Searching patient history...</td></tr>';

                const res = await fetch(`${API_BASE}/patients/history?${params.toString()}`);
                const data = await res.json();
                
                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #94a3b8;">No matching patient records found.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(p => {
                    let statusClass = 'bg-gray'; let icon = 'fa-clock';
                    if(p.status === 'completed') { statusClass = 'bg-green'; icon = 'fa-check-circle'; }
                    else if(p.status === 'prescribed') { statusClass = 'bg-blue'; icon = 'fa-prescription-bottle-alt'; }

                    const initial = p.name ? p.name.charAt(0).toUpperCase() : 'P';
                    
                    let rxHtml = '';
                    if (p.prescriptionId) {
                        rxHtml = `
                            <div style="font-size: 11px; color: #0284c7; font-weight: 600; margin-top: 4px; display: inline-flex; align-items: center; gap: 4px;">
                                <i class="fas fa-file-prescription"></i> Rx ID: ${p.prescriptionId}
                            </div>
                        `;
                    }

                    return `
                        <tr>
                            <td>
                                <div class="patient-card">
                                    <div class="avatar">${initial}</div>
                                    <div>
                                        <div style="font-weight: 700; color: #0f172a; font-size:15px;">${p.name}</div>
                                        <div style="font-size:11px; color:#475569; margin-top:2px;">Patient ID: <strong>${p.patientId || 'N/A'}</strong></div>
                                        <div style="font-size:11px; color:#64748b;">Age: ${p.age} | Mob: ${p.contact || 'N/A'}</div>
                                        <div style="font-size:11px; color:#64748b;">Aadhaar: ${p.aadhar || 'N/A'}</div>
                                        ${rxHtml}
                                    </div>
                                </div>
                            </td>
                            <td style="color: #10b981; font-weight: 800; font-size: 16px;">T-${p.token}</td>
                            <td style="font-weight: 600;">
                                ${p.assignedDoctor ? `
                                    <i class="fas fa-stethoscope" style="color:#94a3b8; margin-right:5px;"></i> Dr. ${p.assignedDoctor.name}
                                    <br>
                                    <span style="font-size: 11px; color: #10b981; font-weight: 700; margin-left: 22px;">₹${p.assignedDoctor.fee || 500}</span>
                                ` : '<span style="color:#94a3b8;">Unassigned</span>'}
                            </td>
                            <td style="color: #475569;">${p.problem}</td>
                            <td><span class="badge ${statusClass}"><i class="fas ${icon}"></i> ${p.status.toUpperCase()}</span></td>
                            <td>
                                <div class="time-box">
                                    <div class="time-item" style="border-bottom:1px solid #e2e8f0; padding-bottom:4px; margin-bottom:2px;"><i class="far fa-calendar-alt"></i> Date <span class="time-val">${fmtDate(p.createdAt)}</span></div>
                                    <div class="time-item">Registration <span class="time-val">${fmtTime(p.createdAt)}</span></div>
                                    <div class="time-item">Consultation <span class="time-val">${fmtTime(p.consultedAt)}</span></div>
                                    <div class="time-item">Departed <span class="time-val">${fmtTime(p.completedAt)}</span></div>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                document.getElementById('historyBody').innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: red;">Error loading history.</td></tr>';
            }
        }

        function clearFilters() {
            document.getElementById('searchType').value = 'patientId';
            document.getElementById('searchValue').value = '';
            document.getElementById('searchDate').value = '';
            fetchHistory();
        }

        fetchHistory();
    </script>

</body>
</html>
